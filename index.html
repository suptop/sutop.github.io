<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <title>多层书架展示</title>
    <link rel="stylesheet" href="style.css" />

    <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        body {
          display: flex;
          height: 100vh;
          font-family: sans-serif;
          overflow: hidden;
          position: relative;
        }
        .bookshelf-wrapper {
          flex: 1;
          padding: 20px;
          overflow-y: auto;
          background: #f3f1eb;
        }
        .shelf-layer {
          margin-bottom: 40px;
        }
        .shelf-layer h3 {
          margin-bottom: 10px;
          font-size: 18px;
          color: #333;
          border-left: 4px solid #aaa;
          padding-left: 10px;
        }
        .shelf {
          display: flex;
          flex-wrap: wrap;
          gap: 1px;
        }
        .book-container, .manga-container, .tool-container,
        .game-container, .bluray-container, .tape-container {
          position: relative;
          cursor: pointer;
        }
        .book-spine {
          width: 40px;
          height: 200px;
          background: linear-gradient(to bottom, #555, #777);
          writing-mode: vertical-rl;
          color: #fff;
          text-align: center;
          padding: 5px;
          font-size: 14px;
          border-radius: 4px;
          z-index: 1;
        }
        .manga-spine {
          width: 40px;
          height: 200px;
          background: linear-gradient(to bottom, #c0392b, #e74c3c);
          writing-mode: vertical-rl;
          color: #fff;
          text-align: center;
          padding: 5px;
          font-size: 14px;
          border-radius: 4px;
          z-index: 1;
        }
        .tool-spine {
          width: 40px;
          height: 200px;
          background: linear-gradient(to bottom, #2c3e50, #34495e);
          writing-mode: vertical-rl;
          color: #fff;
          text-align: center;
          padding: 5px;
          font-size: 14px;
          border-radius: 4px;
          z-index: 1;
        }
        .game-spine {
          width: 40px;
          height: 140px;
          background: linear-gradient(to bottom, #224488, #4466aa);
          writing-mode: vertical-rl;
          color: #fff;
          text-align: center;
          padding: 5px;
          font-size: 13px;
          border-radius: 4px;
          z-index: 1;
        }
        .bluray-spine {
          width: 40px;
          height: 120px;
          background: linear-gradient(to bottom, #2980b9, #3498db);
          writing-mode: vertical-rl;
          color: #fff;
          text-align: center;
          padding: 5px;
          font-size: 13px;
          border-radius: 4px;
          z-index: 1;
        }
        .tape-spine {
          width: 40px;
          height: 120px;
          background: linear-gradient(to bottom, #7f8c8d, #95a5a6);
          writing-mode: vertical-rl;
          color: #fff;
          text-align: center;
          padding: 5px;
          font-size: 13px;
          border-radius: 4px;
          z-index: 1;
        }
        .sidebar {
          width: 220px;
          background: #fff;
          border-left: 1px solid #ddd;
          padding: 20px;
          overflow-y: auto;
          z-index: 1;
        }
        .sidebar h2 {
          font-size: 16px;
          margin-bottom: 10px;
          border-bottom: 1px solid #ccc;
          padding-bottom: 4px;
        }
        .sidebar .user {
          text-align: center;
          margin-bottom: 20px;
        }
        .sidebar .user img {
          width: 60px;
          height: 60px;
          border-radius: 50%;
        }
        .sidebar .user p {
          margin-top: 8px;
          font-weight: bold;
        }
        .sidebar .menu-section {
          margin-bottom: 20px;
        }
        .sidebar ul {
          list-style: none;
          padding-left: 10px;
        }
        .sidebar li {
          margin: 6px 0;
          cursor: pointer;
          color: #333;
        }
        .sidebar li:hover {
          text-decoration: underline;
        }
        .hover-cover {
          position: absolute;
          width: 160px;
          background-size: cover;
          background-position: center;
          border-radius: 4px;
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
          opacity: 0;
          pointer-events: none;
          transform-origin: right center;
          transition: transform 0.3s ease, opacity 0.3s ease;
          z-index: 9999;
        }
        
    </style>
</head>

<body>
    <div class="bookshelf-wrapper">
        <div class="shelf-layer">
            <h3>📚 图书区</h3>
            <div class="shelf" id="bookShelf"></div>
        </div>
        <div class="shelf-layer">
            <h3>📖 漫画区</h3>
            <div class="shelf" id="mangaShelf"></div>
        </div>
        <div class="shelf-layer">
            <h3>🔧 工具书区</h3>
            <div class="shelf" id="toolShelf"></div>
        </div>
        <div class="shelf-layer">
            <h3>🎮 游戏盒区</h3>
            <div class="shelf" id="gameShelf"></div>
        </div>
        <div class="shelf-layer">
            <h3>💿 蓝光电影区</h3>
            <div class="shelf" id="blurayShelf"></div>
        </div>
        <div class="shelf-layer">
            <h3>📼 磁带区</h3>
            <div class="shelf" id="tapeShelf"></div>
        </div>
    </div>

    <div class="sidebar">
        <div class="user">
            <img src="https://i.pravatar.cc/100?u=me" alt="头像">
            <p>用户名</p>
        </div>

        <div class="menu-section">
            <h2>书架分类</h2>
            <ul>
                <li>全部</li>
                <li>小说</li>
                <li>漫画</li>
                <li>工具书</li>
            </ul>
        </div>

        <div class="menu-section">
            <h2>最近阅读</h2>
            <ul>
                <li>活着</li>
                <li>三体</li>
            </ul>
        </div>

        <div class="menu-section">
            <h2>阅读统计</h2>
            <ul>
                <li>今日阅读：15分钟</li>
                <li>本周：1小时45分</li>
            </ul>
        </div>
    </div>

    <div id="hoverCover" class="hover-cover"></div>

    <script src="script.js"></script>

    <script>
        const hoverCover = document.getElementById('hoverCover');
        
        /**
         * 创建条目：书籍、漫画、工具书、游戏、蓝光、磁带
         */
        function createItem(container, className, title, coverUrl, coverHeight) {
          const item = document.createElement('div');
          item.className = `${className}-container`;
        
          const spine = document.createElement('div');
          spine.className = `${className}-spine`;
          spine.innerText = title;
        
          item.appendChild(spine);
        
          item.addEventListener('mouseenter', (e) => {
            const rect = e.target.getBoundingClientRect();
            hoverCover.style.backgroundImage = `url('${coverUrl}')`;
            hoverCover.style.height = coverHeight + 'px';
            hoverCover.style.left = rect.right + 10 + 'px';
            hoverCover.style.top = rect.top + 'px';
            hoverCover.style.opacity = '1';
            hoverCover.style.transform = 'scaleX(1)';
          });
        
          item.addEventListener('mouseleave', () => {
            hoverCover.style.opacity = '0';
            hoverCover.style.transform = 'scaleX(0.8)';
          });
        
          container.appendChild(item);
        }
        
        // 数据源定义
        const datasets = [
          {
            id: 'bookShelf',
            className: 'book',
            data: [
              { title: '活着', cover: 'https://images-cn.ssl-images-amazon.com/images/I/81MZV1KFFzL.jpg', height: 200 },
              { title: '百年孤独', cover: 'https://images-cn.ssl-images-amazon.com/images/I/81CEb3J3ZzL.jpg', height: 200 },
              { title: '三体', cover: 'https://images-cn.ssl-images-amazon.com/images/I/81dPpM3A+XL.jpg', height: 200 }
            ]
          },
          {
            id: 'mangaShelf',
            className: 'manga',
            data: [
              { title: '火影忍者', cover: 'https://m.media-amazon.com/images/I/81yrqWy5bIL.jpg', height: 200 },
              { title: '进击的巨人', cover: 'https://m.media-amazon.com/images/I/91oOHhFQQFL.jpg', height: 200 }
            ]
          },
          {
            id: 'toolShelf',
            className: 'tool',
            data: [
              { title: 'JavaScript权威指南', cover: 'https://images-cn.ssl-images-amazon.com/images/I/81AJdOIEIhL.jpg', height: 200 },
              { title: 'CSS揭秘', cover: 'https://images-cn.ssl-images-amazon.com/images/I/71L-HvKfYvL.jpg', height: 200 }
            ]
          },
          {
            id: 'gameShelf',
            className: 'game',
            data: [
              { title: '塞尔达传说', cover: 'https://m.media-amazon.com/images/I/71PEHDccmwL.jpg', height: 140 },
              { title: '马里奥赛车', cover: 'https://m.media-amazon.com/images/I/81MPYk2fRxL.jpg', height: 140 }
            ]
          },
          {
            id: 'blurayShelf',
            className: 'bluray',
            data: [
              { title: '银翼杀手2049', cover: 'https://m.media-amazon.com/images/I/81fLXQdAG-L._AC_SL1500_.jpg', height: 120 },
              { title: '星际穿越', cover: 'https://m.media-amazon.com/images/I/91cZ-e92DLL._AC_SL1500_.jpg', height: 120 }
            ]
          },
          {
            id: 'tapeShelf',
            className: 'tape',
            data: [
              { title: 'The Beatles', cover: 'https://m.media-amazon.com/images/I/91kjb5cvPXL._SL1500_.jpg', height: 120 },
              { title: 'Queen - Greatest Hits', cover: 'https://m.media-amazon.com/images/I/81VGABfHo7L._SL1500_.jpg', height: 120 }
            ]
          }
        ];
        
        // 渲染所有书架内容
        datasets.forEach(({ id, className, data }) => {
          const shelf = document.getElementById(id);
          data.forEach(item => {
            createItem(shelf, className, item.title, item.cover, item.height);
          });
        });
        
    </script>
</body>

</html>
